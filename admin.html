<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #f0f2f5;
            --accent-color: #2c3e50;
            --text-color: #333;
            --border-color: #ddd;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--primary-color);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        h1 {
            color: var(--text-color);
        }
        .nav-links a {
            margin-left: 1rem;
            text-decoration: none;
            color: var(--accent-color);
            font-weight: 500;
        }
        #logout-btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 20px;
            background-color: var(--accent-color);
            color: white;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #logout-btn:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>Admin Dashboard</h1>
            <div class="nav-links">
                <a href="index.html">View Site</a>
                <button id="logout-btn">Logout</button>
            </div>
        </header>
        <main>
            <h2>Welcome, Admin!</h2>
            <p>This is your dashboard. You can add more site management features here.</p>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // ENTER YOUR FIREBASE CONFIG CODE HERE
        const firebaseConfig = {
            apiKey: "AIzaSyCUp8NQyfh3WRQd3qrCYtnGc7sTHJqfLrE",
            authDomain: "zulqarnain-ali.firebaseapp.com",
            databaseURL: "https://zulqarnain-ali-default-rtdb.firebaseio.com",
            projectId: "zulqarnain-ali",
            storageBucket: "zulqarnain-ali.firebasestorage.app",
            messagingSenderId: "626426491607",
            appId: "1:626426491607:web:83a5dedd5844306b237692",
            measurementId: "G-80199PJVBE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const adminEmail = "mrvlogging08@gmail.com";

        // Auth Guard
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== adminEmail) {
                window.location.href = 'login.html';
            }
        });

        // Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth).catch((error) => console.error('Logout Error:', error));
        });
    </script>
</body>
</html>
