<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - Zulqarnain Ali</title>
    <style>
        /* --- Google Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        /* --- Global Styles & Variables --- */
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2d2d2d;
            --accent-color: #00aaff;
            --text-color: #f0f0f0;
            --card-bg: #252525;
            --border-color: #444;
            --success-color: #28a745;
            --error-color: #dc3545;
            --font-english: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-english);
            background-color: var(--primary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: var(--secondary-color);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-container h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .auth-container p {
            margin-bottom: 30px;
            color: #ccc;
        }

        .auth-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: var(--text-color);
            font-family: var(--font-english);
            font-size: 1rem;
        }

        .auth-form input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1.1rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0088cc;
        }

        .form-toggle {
            margin-top: 20px;
        }

        .form-toggle a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .form-toggle a:hover {
            text-decoration: underline;
        }

        #signup-form, #reset-form {
            display: none;
        }

        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
        .message.success {
            background-color: var(--success-color);
            color: #fff;
        }
        .message.error {
            background-color: var(--error-color);
            color: #fff;
        }

    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Login Form -->
        <div id="login-form">
            <h1>Login</h1>
            <p>Welcome back! Please login to your account.</p>
            <form class="auth-form" id="login-form-main">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn">Login</button>
            </form>
            <div class="form-toggle">
                <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
                <p><a href="#" id="show-reset">Forgot Password?</a></p>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signup-form">
            <h1>Sign Up</h1>
            <p>Create a new account to get started.</p>
            <form class="auth-form" id="signup-form-main">
                <input type="email" id="signup-email" placeholder="Email" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <div class="form-toggle">
                <p>Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>
        </div>

        <!-- Password Reset Form -->
        <div id="reset-form">
            <h1>Reset Password</h1>
            <p>Enter your email to receive a password reset link.</p>
            <form class="auth-form" id="reset-form-main">
                <input type="email" id="reset-email" placeholder="Email" required>
                <button type="submit" class="btn">Send Reset Link</button>
            </form>
            <div class="form-toggle">
                <p>Remembered your password? <a href="#" id="show-login-from-reset">Login</a></p>
            </div>
        </div>

        <div id="message-box" class="message"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-firestore.js"></script>

    <script>
        // --- Initialize Firebase (ADD YOUR CONFIG HERE) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- DOM Elements ---
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const resetForm = document.getElementById('reset-form');

        const showSignupBtn = document.getElementById('show-signup');
        const showLoginBtn = document.getElementById('show-login');
        const showResetBtn = document.getElementById('show-reset');
        const showLoginFromResetBtn = document.getElementById('show-login-from-reset');

        const messageBox = document.getElementById('message-box');

        // --- Form Toggling Logic ---
        showSignupBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            signupForm.style.display = 'block';
            resetForm.style.display = 'none';
        });

        showLoginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
        });

        showResetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'none';
            resetForm.style.display = 'block';
        });

        showLoginFromResetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.style.display = 'block';
            resetForm.style.display = 'none';
        });

        // --- Message Display ---
        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
            messageBox.style.display = 'block';
        }

        // --- Firebase Auth Logic ---

        // Signup
        document.getElementById('signup-form-main').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Set default role for new user
                    return db.collection('users').doc(userCredential.user.uid).set({
                        email: userCredential.user.email,
                        role: 'user' // default role
                    });
                })
                .then(() => {
                    showMessage('Signup successful! Please login.', 'success');
                    // Switch to login form
                    loginForm.style.display = 'block';
                    signupForm.style.display = 'none';
                })
                .catch((error) => {
                    showMessage(error.message, 'error');
                });
        });

        // Login
        document.getElementById('login-form-main').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Check user role
                    const user = userCredential.user;
                    return db.collection('users').doc(user.uid).get();
                })
                .then((doc) => {
                    if (doc.exists) {
                        const userData = doc.data();
                        if (userData.role === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'profile.html';
                        }
                    } else {
                        throw new Error("User data not found.");
                    }
                })
                .catch((error) => {
                    showMessage(error.message, 'error');
                });
        });

        // Password Reset
        document.getElementById('reset-form-main').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    showMessage('Password reset email sent! Check your inbox.', 'success');
                })
                .catch((error) => {
                    showMessage(error.message, 'error');
                });
        });

    </script>

</body>
</html>
