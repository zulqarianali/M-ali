<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2c2c2c;
            --accent-color: #fca311;
            --text-color: #e5e5e5;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--primary-color);
        }
        .form-wrapper {
            width: 400px;
            background: var(--secondary-color);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .form-header {
            display: flex;
        }
        .form-header button {
            flex: 1;
            padding: 1rem;
            border: none;
            background: var(--secondary-color);
            color: var(--text-color);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .form-header button.active {
            background-color: var(--accent-color);
            color: #14213d;
        }
        .form-container {
            padding: 2rem;
        }
        .form-box {
            display: none;
        }
        .form-box.active {
            display: block;
        }
        .input-box {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .input-box input {
            width: 100%;
            padding: 1rem;
            padding-right: 45px;
            background: var(--primary-color);
            border: 1px solid #444;
            border-radius: 5px;
            color: var(--text-color);
            font-size: 1rem;
        }
        .input-box i {
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            cursor: pointer;
        }
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .remember-forgot a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 5px;
            background-color: var(--accent-color);
            color: #14213d;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        .btn:hover {
            opacity: 0.9;
        }
        #message {
            text-align: center;
            margin-top: 1.5rem;
            font-weight: 500;
            color: #ff6b6b;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="form-wrapper">
        <header class="form-header">
            <button id="login-tab-btn" class="active">Login</button>
            <button id="signup-tab-btn">Sign Up</button>
        </header>

        <div class="form-container">
            <!-- Login Form -->
            <div id="login-form-box" class="form-box active">
                <form id="login-form">
                    <div class="input-box">
                        <input type="email" id="login-email" placeholder="Email" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="login-password" placeholder="Password" required>
                        <i class="fa-solid fa-eye-slash" id="toggle-login-password"></i>
                    </div>
                    <div class="remember-forgot">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#" id="forgot-password-link">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signup-form-box" class="form-box">
                <form id="signup-form">
                    <div class="input-box">
                        <input type="email" id="signup-email" placeholder="Email" required>
                        <i class="fa-solid fa-envelope"></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="signup-password" placeholder="Password" required>
                        <i class="fa-solid fa-eye-slash" id="toggle-signup-password"></i>
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                </form>
            </div>
            <p id="message"></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // ENTER YOUR FIREBASE CONFIG CODE HERE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCUp8NQyfh3WRQd3qrCYtnGc7sTHJqfLrE",
            authDomain: "zulqarnain-ali.firebaseapp.com",
            databaseURL: "https://zulqarnain-ali-default-rtdb.firebaseio.com",
            projectId: "zulqarnain-ali",
            storageBucket: "zulqarnain-ali.firebasestorage.app",
            messagingSenderId: "626426491607",
            appId: "1:626426491607:web:83a5dedd5844306b237692",
            measurementId: "G-80199PJVBE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const adminEmail = 'mrvlogging08@gmail.com';

        const loginTab = document.getElementById('login-tab-btn');
        const signupTab = document.getElementById('signup-tab-btn');
        const loginFormBox = document.getElementById('login-form-box');
        const signupFormBox = document.getElementById('signup-form-box');
        const messageEl = document.getElementById('message');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginFormBox.classList.add('active');
            signupFormBox.classList.remove('active');
            messageEl.textContent = '';
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupFormBox.classList.add('active');
            loginFormBox.classList.remove('active');
            messageEl.textContent = '';
        });

        function togglePasswordVisibility(passwordInputId, toggleIconId) {
            const passwordInput = document.getElementById(passwordInputId);
            const toggleIcon = document.getElementById(toggleIconId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }

        document.getElementById('toggle-login-password').addEventListener('click', () => togglePasswordVisibility('login-password', 'toggle-login-password'));
        document.getElementById('toggle-signup-password').addEventListener('click', () => togglePasswordVisibility('signup-password', 'toggle-signup-password'));

        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            messageEl.textContent = 'Signing up...';
            createUserWithEmailAndPassword(auth, email, password)
                .then(() => {
                    messageEl.textContent = 'Signup successful! Redirecting...';
                    window.location.href = 'index.html';
                })
                .catch((error) => { messageEl.textContent = `Error: ${error.message.replace('Firebase: ', '')}`; });
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            messageEl.textContent = 'Logging in...';
            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    messageEl.textContent = 'Login successful! Redirecting...';
                    if (userCredential.user.email === adminEmail) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                })
                .catch((error) => { messageEl.textContent = `Error: ${error.message.replace('Firebase: ', '')}`; });
        });

        document.getElementById('forgot-password-link').addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            if (!email) {
                messageEl.textContent = 'Please enter your email to reset password.';
                return;
            }
            messageEl.textContent = 'Sending password reset email...';
            sendPasswordResetEmail(auth, email)
                .then(() => { messageEl.textContent = 'Password reset email sent!'; })
                .catch((error) => { messageEl.textContent = `Error: ${error.message.replace('Firebase: ', '')}`; });
        });
    </script>
</body>
</html>
