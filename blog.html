<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Zulqarnain Ali</title>
    <style>
        /* --- Google Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        /* --- Global Styles & Variables --- */
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2d2d2d;
            --accent-color: #00aaff;
            --text-color: #f0f0f0;
            --card-bg: #252525;
            --border-color: #444;
            --font-english: 'Poppins', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-english);
            background-color: var(--primary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 0 20px;
        }

        h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            color: var(--accent-color);
        }

        h2::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background-color: var(--accent-color);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        section {
            padding: 80px 0;
        }

        /* --- Header & Navigation --- */
        .header {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 15px 0;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .menu-toggle {
            display: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--accent-color);
        }

        /* --- Blog Posts --- */
        .blog-post {
            background-color: var(--secondary-color);
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 8px;
            border-left: 5px solid var(--accent-color);
        }
        .blog-post h3 {
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.8rem;
        }
        .post-meta {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 20px;
        }
        .post-content {
            white-space: pre-wrap; /* Respects newlines in the content */
        }

        /* --- Footer --- */
        .footer {
            background-color: #111;
            color: #aaa;
            padding: 40px 0 20px;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--secondary-color);
                flex-direction: column;
                padding: 20px 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.5s ease-out, padding 0.5s ease-out;
            }

            .nav-links.active {
                max-height: 500px;
                padding: 20px 0;
            }

            .nav-links li {
                margin: 10px 0;
                text-align: center;
            }

            .menu-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">Zulqarnain <span>Ali</span></a>
            <div class="menu-toggle" id="menu-toggle">
                <i class="fas fa-bars"></i>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </div>
    </header>

    <!-- Blog Section -->
    <section id="blog">
        <div class="container">
            <h2>Latest Posts</h2>
            <div id="posts-container">
                <!-- Posts will be loaded here by JavaScript -->
                <p>Loading posts...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Zulqarnain Ali. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.1/firebase-firestore.js"></script>

    <script>
        // --- Initialize Firebase (ADD YOUR CONFIG HERE) ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const postsCollection = db.collection('posts');

        // --- DOM Elements ---
        const postsContainer = document.getElementById('posts-container');

        // --- Load and Display Posts ---
        function loadPosts() {
            postsCollection.orderBy('createdAt', 'desc').get().then(snapshot => {
                postsContainer.innerHTML = '';
                if (snapshot.empty) {
                    postsContainer.innerHTML = '<p>No posts have been published yet. Check back soon!</p>';
                    return;
                }
                snapshot.forEach(doc => {
                    const post = doc.data();
                    const postElement = document.createElement('article');
                    postElement.className = 'blog-post';

                    const postDate = post.createdAt.toDate().toLocaleDateString('en-US', {
                        year: 'numeric', month: 'long', day: 'numeric'
                    });

                    postElement.innerHTML = `
                        <h3>${post.title}</h3>
                        <div class="post-meta">Published on ${postDate}</div>
                        <div class="post-content">${post.content}</div>
                    `;
                    postsContainer.appendChild(postElement);
                });
            }).catch(error => {
                console.error("Error loading posts: ", error);
                postsContainer.innerHTML = '<p>Could not load posts due to an error.</p>';
            });
        }

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
            loadPosts();

            // --- Mobile Menu Toggle ---
            const menuToggle = document.getElementById('menu-toggle');
            const navLinks = document.getElementById('nav-links');
            menuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        });
    </script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
