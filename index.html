<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulqarnain Ali - Graphic Designer & Video Editor</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- Google Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Jameel+Noori+Nastaleeq&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');

        /* --- Global Styles & Variables --- */
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2d2d2d;
            --accent-color: #00aaff;
            --text-color: #f0f0f0;
            --dark-text-color: #333;
            --card-bg: #252525;
            --border-color: #444;
            --font-english: 'Poppins', sans-serif;
            --font-urdu: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-english);
            background-color: var(--primary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        h1 {
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 0.5rem; /* Reduced margin */
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.2);
        }

        .btn:hover {
            background: transparent;
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-secondary:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* --- Utility Classes --- */
        .urdu-text {
            font-family: var(--font-urdu);
            direction: rtl;
        }

        /* --- Custom Animations --- */

        /* 1. Image Animation Keyframes: Zoom and Shadow Effect */
        @keyframes zoomInFloat {
            0% { transform: scale(0.8); opacity: 0; box-shadow: 0 0 0 rgba(0, 170, 255, 0); }
            100% { transform: scale(1.0); opacity: 1; box-shadow: 0 0 30px rgba(0, 170, 255, 0.4); }
        }

        /* 2. Text/Cursor Animation Keyframes: Blinking Effect for Typewriter */
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--accent-color); }
        }
        
        /* Make subtitle opaque initially to hide text before animation */
        .hero-text .subtitle {
            opacity: 0;
            transition: opacity 0.5s;
        }


        /* --- Discount Banner --- */
        .discount-banner {
            background-color: var(--accent-color);
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            z-index: 1001;
            position: relative;
        }

        /* --- Header & Navigation --- */
        .header {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 15px 0;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .menu-toggle {
            display: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--accent-color);
        }

        /* --- Hero Section --- */
        #home {
            min-height: 90vh;
            display: flex;
            align-items: center;
            /* Background image is removed and replaced by the video element */
            position: relative;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden; /* Important for full-screen video background */
        }
        
        /* Video Styling */
        .background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        #home::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 26, 26, 0.7); /* Dark overlay over the video */
            z-index: 1; /* In front of video, behind content */
        }

        .hero-content {
            /* Content should be above the overlay */
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        .hero-image {
            flex-basis: 40%;
            text-align: center;
        }

        .hero-image img {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--accent-color);
            /* Apply Image Animation here */
            animation: zoomInFloat 1.2s ease-out forwards;
            opacity: 0; /* Start hidden for animation */
            object-position: top;
        }

        .hero-text {
            flex-basis: 55%;
        }

        .hero-text h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            color: #fff;
            line-height: 1.2;
            white-space: pre-wrap; /* Ensure text wraps if needed */
        }

        .hero-text h1 span {
            color: var(--accent-color);
        }

        .hero-text .subtitle {
            font-size: 1.8rem;
            color: var(--text-color);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        /* Typewriter Cursor Style */
        .typing-cursor {
            display: inline-block;
            width: 0.15em;
            height: 1.1em;
            background-color: var(--accent-color);
            margin-left: 5px;
            vertical-align: middle;
            animation: blink-caret 0.75s step-end infinite;
        }
        .typing-cursor.finished {
            animation: none;
            opacity: 0;
        }

        .hero-buttons .btn {
            margin-right: 15px;
        }

        /* --- Footer --- */
        .footer {
            background-color: #111;
            color: #aaa;
            padding: 40px 0 20px;
            text-align: center;
        }

        .warning-bar {
            background-color: #ffc107;
            color: #333;
            padding: 8px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* --- Floating WhatsApp Button --- */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: #FFF;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 999;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        /* --- Responsive Design --- */
        @media (max-width: 992px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
            }
            .hero-image {
                margin-bottom: 2rem;
            }
            .hero-text h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--secondary-color);
                flex-direction: column;
                padding: 20px 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.5s ease-out, padding 0.5s ease-out;
            }

            .nav-links.active {
                max-height: 500px;
                padding: 20px 0;
            }

            .nav-links li {
                margin: 10px 0;
                text-align: center;
            }

            .menu-toggle {
                display: block;
            }
        }
    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- Mobile Menu Toggle ---
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks = document.getElementById('nav-links');
        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });

        // Animation speed adjusted: 150ms per character (slower than 100ms)
        const typingSpeed = 150; 

        /**
         * Applies the typewriter effect to an element.
         * @param {HTMLElement} element - The target HTML element.
         * @param {string} textToType - The full text to type.
         * @param {number} colorSplitIndex - Index to start applying accent color. Use -1 for no colored text.
         * @param {Function} [onComplete] - Callback function when typing is finished.
         */
        function applyTypewriter(element, textToType, colorSplitIndex, onComplete) {
            let i = 0;
            const originalText = textToType;
            element.textContent = ''; // Clear content to start typing
            
            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            element.appendChild(cursor);

            let coloredSpan = null;

            const timer = setInterval(() => {
                if (i < originalText.length) {
                    const char = originalText.charAt(i);
                    
                    if (i === colorSplitIndex) {
                        // Start of the colored word ('Ali' in the title case)
                        coloredSpan = document.createElement('span');
                        coloredSpan.style.color = 'var(--accent-color)';
                        element.insertBefore(coloredSpan, cursor);
                        coloredSpan.textContent += char;
                    } else if (i > colorSplitIndex && coloredSpan) {
                        // Continuation of the colored word - Fixed the logic here
                        coloredSpan.textContent += char;
                    } else {
                        // Normal text (e.g., 'Zulqarnain ' or subtitle)
                        element.insertBefore(document.createTextNode(char), cursor);
                    }
                    i++;
                } else {
                    clearInterval(timer);
                    // Stop the cursor blink after typing is finished
                    setTimeout(() => {
                        cursor.classList.add('finished');
                        if (onComplete) {
                            onComplete();
                        }
                    }, 500); 
                }
            }, typingSpeed);
        }

        // --- Title Animation ---
        const titleElement = document.getElementById('hero-title');
        const titleText = 'Zulqarnain Ali';
        // 'Zulqarnain ' has 11 characters (10 letters + 1 space)
        const titleDuration = applyTypewriter(titleElement, titleText, 11, () => {
             // --- Subtitle Animation starts after title is complete ---
             const subtitleElement = document.getElementById('hero-subtitle');
             const subtitleText = subtitleElement.textContent; // Get the original text
             subtitleElement.style.opacity = '1'; // Make subtitle visible before typing
             
             // Apply typewriter to subtitle (no colored text, so index is -1)
             applyTypewriter(subtitleElement, subtitleText, -1); 
        });

        // The image animation already starts on load via CSS, no need for extra JS timing.
    });
    </script>
