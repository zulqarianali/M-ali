<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zulqarnain Ali - Graphic Designer & Video Editor</title>
    <style>
        /* --- Google Fonts --- */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Jameel+Noori+Nastaleeq&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');

        /* --- Global Styles & Variables --- */
        :root {
            --primary-color: #1a1a1a;
            --secondary-color: #2d2d2d;
            --accent-color: #00aaff;
            --text-color: #f0f0f0;
            --dark-text-color: #333;
            --card-bg: #252525;
            --border-color: #444;
            --font-english: 'Poppins', sans-serif;
            --font-urdu: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-english);
            background-color: var(--primary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 20px;
        }

        h1 {
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: var(--accent-color);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 15px rgba(0, 170, 255, 0.2);
        }

        .btn:hover {
            background: transparent;
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-3px);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .btn-secondary:hover {
            background: var(--accent-color);
            color: #fff;
        }

        /* --- Utility Classes --- */
        .urdu-text {
            font-family: var(--font-urdu);
            direction: rtl;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        /* --- Discount Banner --- */
        .discount-banner {
            background-color: var(--accent-color);
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            z-index: 1001;
            position: relative;
        }

        /* --- Header & Navigation --- */
        .header {
            background-color: rgba(26, 26, 26, 0.9);
            padding: 15px 0;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-color);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-color);
        }

        .nav-links {
            list-style: none;
            display: flex;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
            padding-bottom: 5px;
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-color);
        }

        .nav-links a:hover::after, .nav-links a.active::after {
            width: 100%;
        }

        .menu-toggle {
            display: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--accent-color);
        }

        /* --- Hero Section --- */
        #home {
            min-height: 90vh;
            display: flex;
            align-items: center;
            background: url('https://i.pinimg.com/736x/33/8a/8c/338a8cdc8400d6ae9f0eafa56dfde38f.jpghttps://i.pinimg.com/736x/33/8a/8c/338a8cdc8400d6ae9f0eafa56dfde38f.jpghttps://i.pinimg.com/736x/33/8a/8c/338a8cdc8400d6ae9f0eafa56dfde38f.jpg') no-repeat center center/cover;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        #home::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 26, 26, 0.7);
        }

        .hero-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            position: relative;
            z-index: 1;
        }

        .hero-image {
            flex-basis: 40%;
            text-align: center;
        }

        .hero-image img {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--accent-color);
            box-shadow: 0 0 30px rgba(0, 170, 255, 0.4);
            object-position: top;
        }

        .hero-text {
            flex-basis: 55%;
        }

        .hero-text h1 {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            color: #fff;
            line-height: 1.2;
        }

        .hero-text h1 span {
            color: var(--accent-color);
        }

        .hero-text .subtitle {
            font-size: 1.8rem;
            color: var(--text-color);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .hero-buttons .btn {
            margin-right: 15px;
        }

        /* --- Footer --- */
        .footer {
            background-color: #111;
            color: #aaa;
            padding: 40px 0 20px;
            text-align: center;
        }

        .warning-bar {
            background-color: #ffc107;
            color: #333;
            padding: 8px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* --- Floating WhatsApp Button --- */
        .whatsapp-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: #25D366;
            color: #FFF;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 999;
            transition: transform 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        /* --- Responsive Design --- */
        @media (max-width: 992px) {
            .hero-content {
                flex-direction: column;
                text-align: center;
            }
            .hero-image {
                margin-bottom: 2rem;
            }
            .hero-text h1 {
                font-size: 3rem;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background-color: var(--secondary-color);
                flex-direction: column;
                padding: 20px 0;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.5s ease-out, padding 0.5s ease-out;
            }

            .nav-links.active {
                max-height: 500px;
                padding: 20px 0;
            }

            .nav-links li {
                margin: 10px 0;
                text-align: center;
            }

            .menu-toggle {
                display: block;
            }
        }
    </style>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Footer -->
    <footer class="footer">

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- Mobile Menu Toggle ---
        const menuToggle = document.getElementById('menu-toggle');

        menuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    });
    </script>
</body>
