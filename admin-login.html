<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #f0f2f5;
            --accent-color: #2c3e50;
            --text-color: #333;
            --border-color: #ddd;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--primary-color);
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            margin-bottom: 2.5rem;
            color: #777;
        }
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            border-radius: 5px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #34495e;
        }
        #message {
            text-align: center;
            margin-top: 1rem;
            font-weight: 500;
            height: 20px;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Admin Login</h1>
        <p class="subtitle">Access the site dashboard</p>
        <form id="admin-login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <p id="message"></p>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // ENTER YOUR FIREBASE CONFIG CODE HERE
        const firebaseConfig = {
            apiKey: "AIzaSyCUp8NQyfh3WRQd3qrCYtnGc7sTHJqfLrE",
            authDomain: "zulqarnain-ali.firebaseapp.com",
            databaseURL: "https://zulqarnain-ali-default-rtdb.firebaseio.com",
            projectId: "zulqarnain-ali",
            storageBucket: "zulqarnain-ali.firebasestorage.app",
            messagingSenderId: "626426491607",
            appId: "1:626426491607:web:83a5dedd5844306b237692",
            measurementId: "G-80199PJVBE"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const adminEmail = "zulqarnain@gmail.com";

        const loginForm = document.getElementById('admin-login-form');
        const messageEl = document.getElementById('message');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            messageEl.textContent = 'Logging in...';

            if (email !== adminEmail) {
                messageEl.textContent = 'Access Denied. Not an admin email.';
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    // Check again on the credential level
                    if (userCredential.user.email === adminEmail) {
                        messageEl.textContent = 'Login successful! Redirecting...';
                        window.location.href = 'admin.html';
                    } else {
                        messageEl.textContent = 'Access Denied. Not an admin account.';
                        auth.signOut();
                    }
                })
                .catch((error) => {
                    messageEl.textContent = 'Error: Invalid credentials.';
                    console.error("Login Error:", error);
                });
        });
    </script>
</body>
</html>
