<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup - Zulqarnain Ali</title>

    <!-- Google Fonts (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- General Styling & CSS Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f2f5;
        }

        /* --- Main Container --- */
        .container {
            position: relative;
            width: 800px;
            height: 550px;
            background: #fff;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        /* --- Form Container --- */
        .form-container {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.6s ease-in-out;
        }

        .signup-container {
            left: 0;
            z-index: 2;
        }

        .login-container {
            left: 0;
            z-index: 1;
            opacity: 0;
        }

        .container.right-panel-active .signup-container {
            transform: translateX(100%);
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .login-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        form {
            background: #fff;
            display: flex;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        .input-box {
            position: relative;
            width: 100%;
            margin: 8px 0;
        }

        input {
            background: #eee;
            border: none;
            padding: 12px 15px;
            width: 100%;
            border-radius: 5px;
            outline: none;
        }

        .input-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
        }

        a.forgot-password {
            color: #333;
            font-size: 14px;
            text-decoration: none;
            margin: 15px 0;
        }

        button.form-btn {
            border-radius: 20px;
            border: 1px solid #FF4B2B;
            background: #FF4B2B;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in, background 0.3s ease;
            cursor: pointer;
        }

        button.form-btn:hover {
            background: #ff3a18;
        }

        button.form-btn:active {
            transform: scale(0.95);
        }

        /* --- Overlay Container --- */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(-100%);
        }

        .overlay {
            background: #FF416C;
            background: linear-gradient(to right, #FF4B2B, #FF416C);
            color: #fff;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%);
        }

        .overlay-panel {
            position: absolute;
            top: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
            height: 100%;
            width: 50%;
            text-align: center;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left {
            transform: translateX(-20%);
        }

        .container.right-panel-active .overlay-left {
            transform: translateX(0);
        }

        .overlay-right {
            right: 0;
            transform: translateX(0);
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(20%);
        }

        .overlay-panel p {
            font-size: 14px;
            font-weight: 300;
            line-height: 20px;
            letter-spacing: 0.5px;
            margin: 20px 0 30px;
        }

        button.ghost {
            background: transparent;
            border-color: #fff;
        }

        /* --- Message/Alert Styling --- */
        #message {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff3a18;
            font-weight: 500;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }

        /* --- Responsive Design --- */
        @media (max-width: 850px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
            .form-container {
                width: 100%;
            }
            .signup-container {
                z-index: 5;
            }
            .login-container {
                opacity: 0;
                z-index: 1;
            }
            .overlay-container {
                display: none;
            }
            .container.right-panel-active .signup-container {
                transform: none;
                opacity: 0;
            }
            .container.right-panel-active .login-container {
                transform: none;
                opacity: 1;
            }
            /* Add mobile-specific switchers */
            .mobile-switch {
                display: block;
                text-align: center;
                margin-top: 20px;
                font-size: 14px;
            }
            .mobile-switch a {
                color: #FF4B2B;
                font-weight: 600;
                cursor: pointer;
            }
        }

        .mobile-switch {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <!-- Sign Up Form -->
        <div class="form-container signup-container">
            <form id="signup-form">
                <h1>Create Account</h1>
                <div class="input-box">
                    <input type="email" id="signup-email" placeholder="Email" required />
                </div>
                <div class="input-box">
                    <input type="password" id="signup-password" placeholder="Password" required />
                    <i class="fa-solid fa-eye-slash" id="toggle-signup-password"></i>
                </div>
                <button type="submit" class="form-btn">Sign Up</button>
                <div class="mobile-switch">
                    <p>Already have an account? <a id="mobile-login-link">Login</a></p>
                </div>
            </form>
        </div>

        <!-- Login Form -->
        <div class="form-container login-container">
            <form id="login-form">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="email" id="login-email" placeholder="Email" required />
                </div>
                <div class="input-box">
                    <input type="password" id="login-password" placeholder="Password" required />
                     <i class="fa-solid fa-eye-slash" id="toggle-login-password"></i>
                </div>
                <a href="#" class="forgot-password" id="forgot-password-link">Forgot your password?</a>
                <button type="submit" class="form-btn">Login</button>
                 <div class="mobile-switch">
                    <p>Don't have an account? <a id="mobile-signup-link">Sign Up</a></p>
                </div>
            </form>
        </div>

        <!-- Overlay for sliding animation -->
        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Welcome Back!</h1>
                    <p>To keep connected with us please login with your personal info</p>
                    <button class="ghost form-btn" id="login">Login</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Hello, Friend!</h1>
                    <p>Enter your personal details and start your journey with us</p>
                    <button class="ghost form-btn" id="signup">Sign Up</button>
                </div>
            </div>
        </div>

        <p id="message"></p>
    </div>


    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCUp8NQyfh3WRQd3qrCYtnGc7sTHJqfLrE",
            authDomain: "zulqarnain-ali.firebaseapp.com",
            databaseURL: "https://zulqarnain-ali-default-rtdb.firebaseio.com",
            projectId: "zulqarnain-ali",
            storageBucket: "zulqarnain-ali.firebasestorage.app",
            messagingSenderId: "626426491607",
            appId: "1:626426491607:web:83a5dedd5844306b237692",
            measurementId: "G-80199PJVBE"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- DOM Elements ---
        const container = document.getElementById('container');
        const signUpButton = document.getElementById('signup');
        const loginButton = document.getElementById('login');
        const mobileSignupLink = document.getElementById('mobile-signup-link');
        const mobileLoginLink = document.getElementById('mobile-login-link');

        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const messageEl = document.getElementById('message');
        const forgotPasswordLink = document.getElementById('forgot-password-link');

        // --- Form Switching Animation ---
        signUpButton.addEventListener('click', () => container.classList.add('right-panel-active'));
        loginButton.addEventListener('click', () => container.classList.remove('right-panel-active'));
        mobileSignupLink.addEventListener('click', () => container.classList.remove('right-panel-active'));
        mobileLoginLink.addEventListener('click', () => container.classList.add('right-panel-active'));


        // --- Password Visibility Toggle ---
        function togglePasswordVisibility(passwordInputId, toggleIconId) {
            const passwordInput = document.getElementById(passwordInputId);
            const toggleIcon = document.getElementById(toggleIconId);
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }

        document.getElementById('toggle-login-password').addEventListener('click', () => {
            togglePasswordVisibility('login-password', 'toggle-login-password');
        });

        document.getElementById('toggle-signup-password').addEventListener('click', () => {
            togglePasswordVisibility('signup-password', 'toggle-signup-password');
        });

        // --- Firebase Signup ---
        signupForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            messageEl.textContent = 'Signing up...';

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    messageEl.textContent = 'Signup successful! Redirecting...';
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    messageEl.textContent = `Error: ${error.code.replace('auth/', '').replace(/-/g, ' ')}`;
                });
        });

        // --- Firebase Login ---
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const adminEmail = 'zulqarnain@gmail.com';

            messageEl.textContent = 'Logging in...';

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    messageEl.textContent = 'Login successful! Redirecting...';

                    if (user.email === adminEmail) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                })
                .catch((error) => {
                     messageEl.textContent = `Error: ${error.code.replace('auth/', '').replace(/-/g, ' ')}`;
                });
        });

        // --- Firebase Password Reset ---
        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;

            if (!email) {
                messageEl.textContent = 'Please enter your email to reset password.';
                return;
            }

            messageEl.textContent = 'Sending password reset email...';

            sendPasswordResetEmail(auth, email)
                .then(() => {
                    messageEl.textContent = 'Password reset email sent! Check your inbox.';
                })
                .catch((error) => {
                    messageEl.textContent = `Error: ${error.code.replace('auth/', '').replace(/-/g, ' ')}`;
                });
        });
    </script>
</body>
</html>
